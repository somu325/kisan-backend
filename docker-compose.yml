services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kisan_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kisan_network

  postgres:
    image: postgres:16-alpine
    container_name: kisan_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kisan_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kisan_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kisan_network

  redis:
    image: redis:7-alpine
    container_name: kisan_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kisan_network

volumes:
  postgres_data:
  redis_data:

networks:
  kisan_network:
    driver: bridge
